schemaVersion: 1.0.0
ephemeris:
  provider: JPL NAIF / JPL Horizons
  kernel: de442s.bsp
  frame: ECLIPJ2000
  origin: SSB
  units:
    position: AU
    time: UTC
  window:
    startUtc: 1926-01-01T00:00:00Z
  cadence:
    step: P1D
    stepSeconds: 86400
  request:
    center: 500@0
    refPlane: ECLIPTIC
    refSystem: J2000
    outUnits: AU-D
    stepSize: 1 d
format:
  datasetVersion: 2.1.0
  formatVersion: 1.0.0
  chunkSchema: ephemeris.chunk.v1
  encoder: json-base64
  contentType: application/json
  compression: none
  vectorEncoding: float32-base64
datasets:
  primary:
    load: eager
    hotWindowYears: 40
    maxUncompressedBytesPerChunk: 2500000
    maxEncodedBytesPerChunk: 3500000
  auxiliary:
    load: lazy
    hotWindowYears: 20
    maxUncompressedBytesPerChunk: 3500000
    maxEncodedBytesPerChunk: 5000000
