schemaVersion: 1.0.0
ephemeris:
  provider: JPL NAIF / JPL Horizons
  kernel: de442s.bsp
  frame: ECLIPJ2000
  origin: SSB
  units:
    position: AU
    time: UTC
  window:
    startUtc: 1926-01-01T00:00:00Z
  cadence:
    step: P1D
    stepSeconds: 86400
  request:
    center: 500@0
    refPlane: ECLIPTIC
    refSystem: J2000
    outUnits: AU-D
    stepSize: 1 d
format:
  datasetVersion: 2.1.0
  formatVersion: 1.0.0
  chunkSchema: ephemeris.chunk.v2
  encoder: binary-f32-gzip
  contentType: application/octet-stream
  compression: gzip
  vectorEncoding: float32-le
datasets:
  primary:
    load: eager
    hotWindowYears: 40
    maxUncompressedBytesPerChunk: 2500000
    maxEncodedBytesPerChunk: 3500000
  auxiliary:
    load: lazy
    hotWindowYears: 20
    maxUncompressedBytesPerChunk: 3500000
    maxEncodedBytesPerChunk: 5000000
# `enabled` is the body kill switch. The render flags below independently map
# to manifest capabilities; see docs/body-catalog-capabilities.md.
# The belt uses deliberately dramatized markers: the points need to remain
# visually legible at the solar-system scale, rather than reflect true size.
asteroidBeltRender: &asteroidBeltRender
  enabled: true
  defaultVisible: true
  color:
    - 0.72
    - 0.66
    - 0.58
  size: 0.014
  orbitRadiusAu: 3
  cameraFit: false
  trail:
    enabled: false
  label:
    enabled: false
  follow:
    enabled: false
  distance:
    enabled: false
