<style>body {
    background-color: #0e0e0e;
    color: #fff;
    margin: 0;
    overflow-x: hidden
    }
.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24
    }
.cinematic-bg {
    background-image: linear-gradient(to bottom, rgba(14, 14, 14, 0.4), rgba(14, 14, 14, 0.95)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuBiDwVWLVX4avDeWHRrrRu8i_vhAAZNPNs7HOd-6N3ftXbOPY_lK5KlfSqkTUrD-NIcBNmz0WyQ7NaXEur7OLIRqRnSSsVIaFqxfaJ2qnp9YCy4EefLYf7S0oRU6YHAZ8tb-AenSDNZWgtzPPlTOTIKiC1sYYAzm4yuQkboKeFg_m5LW5gD4ZLPHFvoPPBE3KIZgjYv7ypGL0W6Die1LQr4ZFZjTj6JpgEupcdVCa0xMpAoMtcjno3o4Qob55f0eAFsWyj5g3FyDA);

<body class="font-body selection:bg-primary/30">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0e0e0e]/40 backdrop-blur-xl flex justify-between items-center px-8 py-6 shadow-[0_20px_50px_rgba(199,153,255,0.08)] bg-gradient-to-b from-[#1a1919]/50 to-transparent">
<div class="text-2xl font-bold tracking-tighter text-[#c799ff] font-headline">Cosmic Observatory</div>
<nav class="hidden md:flex items-center gap-10">
<a class="font-space-grotesk tracking-[0.1em] uppercase text-xs text-[#adaaaa] hover:text-[#c799ff] transition-colors" href="#">Observatory</a>
<a class="font-space-grotesk tracking-[0.1em] uppercase text-xs text-[#adaaaa] hover:text-[#c799ff] transition-colors" href="#">Star Map</a>
<a class="font-space-grotesk tracking-[0.1em] uppercase text-xs text-[#adaaaa] hover:text-[#c799ff] transition-colors" href="#">Telemetry</a>
<a class="font-space-grotesk tracking-[0.1em] uppercase text-xs text-[#adaaaa] hover:text-[#c799ff] transition-colors" href="#">Archive</a>
</nav>
<div class="flex items-center gap-6">
<button class="text-[#c799ff] hover:bg-[#2c2c2c]/50 p-2 rounded-full transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="text-[#c799ff] hover:bg-[#2c2c2c]/50 p-2 rounded-full transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Hero Content -->
<main class="relative min-h-screen flex flex-col items-center justify-center cinematic-bg px-6" data-alt="Deep space Milky Way background with atmospheric shadows">
<div class="max-w-4xl w-full text-center mb-12 relative z-10">
<h1 class="font-headline text-5xl md:text-7xl lg:text-8xl font-bold tracking-[-0.03em] text-white leading-none mb-6 text-glow">
                CHRONOS <span class="text-primary">ALIGNMENT</span>
</h1>
<p class="font-label text-white/80 tracking-[0.2em] uppercase text-sm md:text-base max-w-lg mx-auto leading-relaxed [text-shadow:_0_2px_4px_rgba(0,0,0,0.8)]">
                Calibrating your celestial trajectory relative to the cosmic horizon.
            </p>
</div>
<!-- Input Section -->
<div class="w-full max-w-2xl bg-black/60 backdrop-blur-3xl p-10 md:p-16 rounded-xl border border-white/10 shadow-2xl relative z-10">
<div class="absolute -top-px left-1/2 -translate-x-1/2 w-24 h-px bg-gradient-to-r from-transparent via-secondary to-transparent"></div>
<div class="flex flex-col gap-12">
<div class="grid grid-cols-3 gap-6 md:gap-10">
<!-- Day -->
<div class="flex flex-col gap-3 group">
<label class="font-label text-[10px] tracking-[0.2em] uppercase text-on-surface-variant group-focus-within:text-secondary transition-colors">Day</label>
<input class="bg-transparent border-0 border-b border-outline-variant/30 py-4 text-2xl md:text-3xl font-headline focus:ring-0 focus:border-secondary transition-all text-white placeholder:text-surface-bright outline-none" placeholder="DD" type="text"/>
</div>
<!-- Month -->
<div class="flex flex-col gap-3 group">
<label class="font-label text-[10px] tracking-[0.2em] uppercase text-on-surface-variant group-focus-within:text-secondary transition-colors">Month</label>
<input class="bg-transparent border-0 border-b border-outline-variant/30 py-4 text-2xl md:text-3xl font-headline focus:ring-0 focus:border-secondary transition-all text-white placeholder:text-surface-bright outline-none" placeholder="MM" type="text"/>
</div>
<!-- Year -->
<div class="flex flex-col gap-3 group">
<label class="font-label text-[10px] tracking-[0.2em] uppercase text-on-surface-variant group-focus-within:text-secondary transition-colors">Year</label>
<input class="bg-transparent border-0 border-b border-outline-variant/30 py-4 text-2xl md:text-3xl font-headline focus:ring-0 focus:border-secondary transition-all text-white placeholder:text-surface-bright outline-none" placeholder="YYYY" type="text"/>
</div>
</div>
<button class="nebula-gradient text-on-primary font-headline font-bold py-5 px-10 rounded-md tracking-[0.05em] uppercase text-sm hover:brightness-110 active:scale-95 transition-all shadow-lg shadow-primary/20">
                    Begin Your Journey
                </button>
</div>
<div class="mt-12 flex justify-between items-center opacity-60">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-xs" data-icon="location_on">location_on</span>
<span class="font-label text-[9px] tracking-widest uppercase">Orbital Sync: Active</span>
</div>
<div class="font-label text-[9px] tracking-widest uppercase">v.4.0.2 telemetry</div>
</div>
</div>
<!-- Background Accents -->
<div class="absolute bottom-20 left-10 hidden lg:block z-10">
<div class="flex flex-col gap-4">
<div class="h-px w-32 bg-gradient-to-r from-outline-variant/40 to-transparent"></div>
<div class="font-label text-[10px] tracking-[0.3em] uppercase text-on-surface-variant rotate-90 origin-left mt-8">Nadir Point 0.0021</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 flex items-center gap-8 bg-[#1a1919]/60 backdrop-blur-2xl w-fit rounded-full px-6 py-3 outline outline-1 outline-[#494847]/15 shadow-[0_0_30px_rgba(199,153,255,0.1)]">
<button class="flex flex-col items-center justify-center text-[#adaaaa] p-3 hover:text-[#c799ff] transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
<span class="font-space-grotesk text-[10px] tracking-widest uppercase mt-1">Play/Pause</span>
</button>
<button class="flex flex-col items-center justify-center text-[#adaaaa] p-3 hover:text-[#c799ff] transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="speed">speed</span>
<span class="font-space-grotesk text-[10px] tracking-widest uppercase mt-1">Speed</span>
</button>
<button class="flex flex-col items-center justify-center text-[#4af8e3] bg-[#2c2c2c] rounded-full p-3 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="straighten">straighten</span>
<span class="font-space-grotesk text-[10px] tracking-widest uppercase mt-1">Distance</span>
</button>
<button class="flex flex-col items-center justify-center text-[#adaaaa] p-3 hover:text-[#c799ff] transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="restart_alt">restart_alt</span>
<span class="font-space-grotesk text-[10px] tracking-widest uppercase mt-1">Reset</span>
</button>
</nav>
<footer class="bg-surface-container-lowest py-12 px-8 text-center relative z-10">
<div class="max-w-7xl mx-auto flex flex-col items-center gap-6">
<div class="text-primary font-headline font-bold text-xl tracking-tighter">COSMIC OBSERVATORY</div>
<div class="h-px w-24 bg-surface-bright"></div>
<p class="font-label text-[10px] tracking-[0.4em] uppercase text-on-surface-variant">Deep Space Initiative © 2024</p>
</div>
</footer>
</body></html>
